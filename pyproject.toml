[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-emotion-detection"
version = "1.0.0"
description = "Voice emotion detection system for employee wellness monitoring"
authors = [{name = "Voice Emotion Detection Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "librosa>=0.10.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "tqdm>=4.64.0",
    "requests>=2.28.0",
    "kaggle>=1.5.12",
    "soundfile>=0.12.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "tensorboard>=2.10.0",
    "onnx>=1.12.0",
    "onnxruntime>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
]
